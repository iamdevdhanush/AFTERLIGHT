name: AFTERLIGHT CI / CD Verification

on:
  push:
    branches: [ master, main, 'feature/**' ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  verify-and-build:
    name: Typecheck, Validate Data, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Strict TypeScript Compilation
        run: npx tsc --noEmit

      - name: NASA Scientific Integrity & Citations Validation (PDS, LROC, JPL)
        run: npm run validate

      - name: Vitest Unit & Regression Tests
        run: npm test

      - name: Vite Production Build
        run: npm run build

  lighthouse-audit:
    name: Lighthouse CI Performance & Accessibility
    runs-on: ubuntu-latest
    needs: verify-and-build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Run Lighthouse CI (Audit Audits)
        uses: treosh/lighthouse-ci-action@v12
        with:
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: './lighthouserc.json'
